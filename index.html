```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.login-container h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#555;
    font-size:14px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#007bff;
}

.form-utilities{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.show-password-container{
    display:flex;
    align-items:center;
    gap:6px;
}

.show-password-container label{
    cursor:pointer;
}

.forgot-password-link{
    text-decoration:none;
    color:#007bff;
    font-weight:600;
}

.forgot-password-link:hover{
    text-decoration:underline;
}

.captcha-wrapper{
    margin-bottom:20px;
}

.captcha-title{
    margin-bottom:10px;
    font-size:14px;
    font-weight:600;
    color:#555;
}

.captcha-display-container{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.captcha-box{
    flex:1;
    height:48px;
    border:1px solid #ccc;
    border-radius:5px;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    letter-spacing:5px;
    color:#222;
    user-select:none;
}

.refresh-captcha-btn{
    width:48px;
    height:48px;
    border:none;
    background:#007bff;
    color:#fff;
    font-size:22px;
    border-radius:5px;
    cursor:pointer;
}

.refresh-captcha-btn:hover{
    background:#0056b3;
}

.error-message{
    color:red;
    text-align:center;
    font-size:14px;
    display:none;
    margin-bottom:15px;
}

.submit-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:5px;
    background:#007bff;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    background:#0056b3;
}
</style>

</head>

<body>

<div class="login-container">

<h2>Account Login</h2>

<form id="loginForm" action="#" method="POST">

<div class="input-group">
<label for="username">Username or Email</label>
<input
type="text"
id="username"
name="username"
placeholder="Enter your username"
required>
</div>

<div class="input-group">
<label for="password">Password</label>
<input
type="password"
id="password"
name="password"
placeholder="Enter your password"
required>
</div>

<div class="form-utilities">

    

<div class="show-password-container">
<input
type="checkbox"
id="showPassword"
onclick="togglePassword()">
<label for="showPassword">Show Password</label>
</div>

<a href="forgot-password.html" class="forgot-password-link">
Forgot Password?
</a>

</div>

<div class="captcha-wrapper">

<div class="captcha-title">
Security Verification
</div>

<div class="captcha-display-container">

<div class="captcha-box" id="captchaBox">
XXXXXX
</div>

<button
type="button"
class="refresh-captcha-btn"
onclick="generateCaptcha()">
↻
</button>

</div>

<div class="input-group">
<input
type="text"
id="captchaInput"
placeholder="Enter CAPTCHA"
required>
</div>

</div>

<div
class="error-message"
id="errorMessage">
Invalid CAPTCHA
</div>

<button
type="submit"
class="submit-btn">
Sign In
</button>

</form>


</div>



<script>

let captchaCode="";

function generateCaptcha(){

const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

captchaCode="";

for(let i=0;i<6;i++){

captchaCode+=chars.charAt(Math.floor(Math.random()*chars.length));

}

document.getElementById("captchaBox").innerHTML=captchaCode;

document.getElementById("captchaInput").value="";

document.getElementById("errorMessage").style.display="none";

}

function togglePassword(){

const password=document.getElementById("password");

if(password.type==="password"){

password.type="text";

}else{

password.type="password";

}

}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const enteredCaptcha=document.getElementById("captchaInput").value.trim().toUpperCase();

if(enteredCaptcha!==captchaCode){

const error=document.getElementById("errorMessage");

error.innerHTML="Invalid CAPTCHA. Please try again.";

error.style.display="block";

generateCaptcha();

return;

}

alert("Login Successful!");

// If using PHP backend, replace the above alert with:
// this.submit();

});

window.onload=generateCaptcha;

</script>

</body>
</html>
